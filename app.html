function advanceDriver(id,action){const j=driverJobs.find(x=>x.id===id);if(!j)return;if(!driverOnline){toast('Go online before updating a delivery');return}if(action==='accept'&&j.status==='Available')j.status='Assigned';else if(action==='pickup'&&j.status==='Assigned')j.status='Picked up';else if(action==='route'&&j.status==='Picked up')j.status='Out for delivery';else if(action==='complete'&&j.status==='Out for delivery'){showDialog('Complete delivery · '+j.orderId,'<div class="notice">Demo OTP: <b>'+esc(j.otp||'2468')+'</b>. In production, OTP must be verified by the server.</div><div class="form-field"><label>Enter OTP *</label><input id="driverOtp" inputmode="numeric" maxlength="4" required></div><div class="form-field"><label>Proof of handover</label><select id="driverProof"><option>Photo captured (demo)</option><option>Customer signature (demo)</option><option>Supervisor review</option></select></div><div class="form-field"><label>Handover note</label><input id="driverNote" placeholder="Handed to customer"></div>','<button class="btn" data-action="close-dialog">Cancel</button><button class="btn primary" data-action="confirm-delivery" data-driver-id="'+esc(id)+'">Confirm delivery</button>');return}else{toast('That transition is not available');return}j.updated=new Date().toISOString();j.history=j.history||[];j.history.push({status:j.status,at:j.updated});writeStore('vyavsetu_driver_jobs',driverJobs);const o=demoOrders.find(x=>x.id===j.orderId);if(o){o.deliveryStatus=j.status;writeStore('vyavsetu_demo_orders',demoOrders)}render();toast(j.orderId+' updated: '+j.status)}

function createDriverJob(order){if(driverJobs.some(j=>j.orderId===order.id))return;const first=order.lines?.[0];const j={id:'DV-'+String(Date.now()).slice(-6),orderId:order.id,shopName:first?.shopName||'Marketplace store',customer:order.customer,phone:order.phone,address:order.address,total:order.total,status:'Available',otp:'2468',created:order.created,history:[{status:'Available',at:order.created}]};driverJobs.unshift(j);writeStore('vyavsetu_driver_jobs',driverJobs);order.deliveryStatus='Available';if(first&&['green','cafe'].includes(first.shop)){kitchenTickets.unshift({id:'K-'+order.id.slice(-6),orderId:order.id,title:(first.shopName||'Restaurant')+' · Marketplace',items:order.lines.map(l=>l.name+' × '+l.qty).join(', '),source:'Delivery',minutes:0,status:'New',created:order.created});writeStore('vyavsetu_kitchen_tickets',kitchenTickets)}}

function beginCheckout(source){const b=source==='pos'?cart:marketCart,n=countCart(b),t=source==='pos'?posTotal():marketTotal(),ps=source==='pos'?posProducts:marketProducts;if(!n){toast('Add products first');return}const lines=Object.entries(b).map(([id,q])=>{const p=ps.find(x=>x.id===id);return p?'<div class="checkout-line"><span>'+esc(p.name)+' × '+q+'</span><b>'+money(p.price*q)+'</b></div>':''}).join('');const market=source==='market';const customerFields=market?'<div class="form-field"><label>Full name *</label><input id="payName" value="'+esc(localStorage.getItem('vyavsetu_customer_name')||'')+'" required></div><div class="form-field"><label>Phone number *</label><input id="payPhone" value="'+esc(localStorage.getItem('vyavsetu_customer_phone')||'')+'" required placeholder="+91 98xxx xxxxx"></div><div class="form-field"><label>Delivery address *</label><textarea id="payAddress" rows="3" required placeholder="Flat, street, landmark">'+esc(localStorage.getItem('vyavsetu_customer_address')||'')+'</textarea></div>':'<div class="form-field"><label>Customer</label><input id="payName" value="Walk-in customer"></div>';const methods=market?'<option value="cod">Cash on delivery</option><option value="upi">UPI (dummy)</option><option value="card">Card (dummy)</option>':'<option value="cash">Cash</option><option value="upi">UPI (dummy)</option><option value="card">Card (dummy)</option>';showDialog(market?'Customer checkout':'POS payment',customerFields+'<div class="checkout-summary"><b>'+n+' items · '+money(t.total)+'</b>'+lines+'<div class="checkout-line"><span>Subtotal</span><b>'+money(t.sub)+'</b></div><div class="checkout-line"><span>Tax (illustrative 5%)</span><b>'+money(t.tax)+'</b></div>'+(market?'<div class="checkout-line"><span>Delivery</span><b>'+money(t.delivery)+'</b></div>':'')+'<div class="checkout-line"><b>Total due</b><b class="checkout-total">'+money(t.total)+'</b></div></div><div class="form-field"><label>Payment mode</label><select id="payMethod">'+methods+'</select></div><div class="form-field"><label>Dummy result</label><select id="payResult"><option value="success">Approve payment</option><option value="declined">Decline payment</option><option value="unknown">Timeout / unknown result</option></select><small>No real payment gateway is used. This simulator cannot charge a card, UPI account or bank.</small></div>','<button class="btn" data-action="close-dialog">Cancel</button><button class="btn primary" data-action="confirm-checkout" data-source="'+source+'">Confirm demo order · '+money(t.total)+'</button>')}
function confirmCheckout(source){const market=source==='market',b=market?marketCart:cart,ps=market?marketProducts:posProducts,t=market?marketTotal():posTotal();if(!countCart(b)){toast('Cart is empty');closeDialog();return}const name=document.getElementById('payName')?.value.trim()||(market?'':'Walk-in customer'),phone=document.getElementById('payPhone')?.value.trim()||'',address=document.getElementById('payAddress')?.value.trim()||'',method=document.getElementById('payMethod').value,result=document.getElementById('payResult').value;if(market&&(!name||!phone||!address)){toast('Enter name, phone and delivery address');return}if(market&&!/^[0-9+ ()-]{8,}$/.test(phone)){toast('Enter a valid phone number');return}const lines=Object.entries(b).map(([id,q])=>{const p=ps.find(x=>x.id===id);return p?{id:p.id,name:p.name,qty:q,price:p.price,shop:p.shop,shopName:p.shopName}:null}).filter(Boolean);const id='VY-'+String(Date.now()).slice(-8),label=({cash:'Cash',card:'Dummy card',upi:'Dummy UPI',cod:'Cash on delivery'})[method];if(result==='declined'){showDialog('Payment declined','<div class="notice">Dummy payment declined. No order has been created and your basket is unchanged. Select another mode or try again.</div><p>Method: <b>'+label+'</b></p><p>Amount: <b>'+money(t.total)+'</b></p>','<button class="btn" data-action="close-dialog">Keep basket</button><button class="btn primary" data-action="retry-checkout" data-source="'+source+'">Try again</button>');return}const pending=result==='unknown';const paid=!pending&&method!=='cod';const order={id,source,customer:name||'Walk-in customer',phone,address,lines,subtotal:t.sub,tax:t.tax,delivery:t.delivery||0,total:t.total,method:label,status:pending?'Payment pending reconciliation':paid?'Paid (dummy)':'Confirmed · collect on delivery',paymentReference:(pending?'DUMMY-PENDING-':paid?'DUMMY-':'COD-')+id,created:new Date().toISOString(),finalInvoice:false};demoOrders.unshift(order);if(!pending){for(const line of lines){const product=ps.find(p=>p.id===line.id);if(product)product.stock=Math.max(0,product.stock-line.qty)}writeStore(market?'vyavsetu_market_products':'vyavsetu_pos_products',ps);if(market)createDriverJob(order)}writeStore('vyavsetu_demo_orders',demoOrders);currentReceipt=order;writeStore('vyavsetu_current_receipt',currentReceipt);if(market){localStorage.setItem('vyavsetu_customer_name',name);localStorage.setItem('vyavsetu_customer_phone',phone);localStorage.setItem('vyavsetu_customer_address',address);marketCart={};writeStore('vyavsetu_market_cart',marketCart)}else{cart={};writeStore('vyavsetu_pos_cart',cart)}closeDialog();render();if(pending){showDialog('Payment status needs checking','<div class="notice">The timeout is intentionally ambiguous. The order was recorded as pending reconciliation—not paid. Do not blindly retry a real payment.</div><p>Reference: <b>'+id+'</b></p><p>Amount: <b>'+money(t.total)+'</b></p>','<button class="btn primary" data-action="close-dialog">Done</button>')}else showReceipt(order);toast(pending?'Order saved as pending':'Dummy checkout complete; no money moved')}
function showReceipt(o){showDialog('Demo receipt · '+o.id,'<div class="receipt-head"><img src="assets/vyavsetu-mark.svg" alt="" style="width:42px"><div><b>VYAVSETU</b><small>ONE ECOSYSTEM. EVERY BUSINESS.</small></div></div><div class="notice">DEMO RECEIPT ONLY — not a statutory tax invoice or proof of real payment.</div><div class="checkout-line"><span>Order reference</span><b>'+esc(o.id)+'</b></div><div class="checkout-line"><span>Customer</span><b>'+esc(o.customer)+'</b></div><div class="checkout-line"><span>Payment mode</span><b>'+esc(o.method)+'</b></div><div class="checkout-line"><span>Payment reference</span><b>'+esc(o.paymentReference)+'</b></div><div class="checkout-line"><span>Status</span><b>'+esc(o.status)+'</b></div>'+o.lines.map(l=>'<div class="checkout-line"><span>'+esc(l.name)+' × '+l.qty+'</span><b>'+money(l.price*l.qty)+'</b></div>').join('')+'<div class="checkout-line"><span>Subtotal</span><b>'+money(o.subtotal)+'</b></div><div class="checkout-line"><span>Illustrative tax</span><b>'+money(o.tax)+'</b></div>'+(o.delivery?'<div class="checkout-line"><span>Delivery</span><b>'+money(o.delivery)+'</b></div>':'')+'<div class="checkout-line"><b>Total</b><b class="checkout-total">'+money(o.total)+'</b></div><p class="flow-desc">Saved in this browser only. This demo receipt is not a tax invoice.</p>','<button class="btn" data-action="close-dialog">Close</button><button class="btn primary" data-action="print-receipt">Print receipt</button>')}
function printDemoReceipt(){if(!currentReceipt){toast('No receipt available');return}window.print()}
function clearDemoCart(source){if(source==='pos'){cart={};writeStore('vyavsetu_pos_cart',cart)}else{marketCart={};writeStore('vyavsetu_market_cart',marketCart)}render();toast('Basket cleared')}
function saveProvisionalBill(){if(!countCart(cart)){toast('Cart is empty');return}const t=posTotal(),lines=Object.entries(cart).map(([id,q])=>{const p=posProducts.find(x=>x.id===id);return p?{id:p.id,name:p.name,qty:q,price:p.price}:null}).filter(Boolean);const o={id:'VY-HOLD-'+String(Date.now()).slice(-6),source:'pos',type:'hold',customer:'Walk-in customer',lines,subtotal:t.sub,tax:t.tax,delivery:0,total:t.total,method:'Not paid',status:'Provisional bill',paymentReference:'—',created:new Date().toISOString(),finalInvoice:false};demoOrders.unshift(o);writeStore('vyavsetu_demo_orders',demoOrders);cart={};writeStore('vyavsetu_pos_cart',cart);render();toast('Provisional bill saved — not a final invoice')}
function resumeBill(id){const o=demoOrders.find(x=>x.id===id&&x.type==='hold');if(!o)return;cart={};for(const l of o.lines){const p=posProducts.find(x=>x.id===l.id);if(p)cart[p.id]=Math.min(l.qty,p.stock)}writeStore('vyavsetu_pos_cart',cart);go('pos');toast('Provisional items restored')}
function viewOrder(id){const o=demoOrders.find(x=>x.id===id);if(o){currentReceipt=o;writeStore('vyavsetu_current_receipt',o);showReceipt(o)}}
function downloadOrders(){const blob=new Blob([JSON.stringify(demoOrders,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vyavsetu-demo-orders.json';a.click();URL.revokeObjectURL(url)}
function clearOrders(){if(confirm('Clear all demo orders from this browser?')){demoOrders=[];writeStore('vyavsetu_demo_orders',demoOrders);render();toast('Order history cleared')}}
function filterRows(){let q=(document.getElementById('stockSearch')?.value||'').toLowerCase();document.querySelectorAll('#stockRows .row').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'flex':'none')}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
