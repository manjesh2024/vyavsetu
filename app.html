<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vyavsetu Workspace</title>
<style>
:root{--bg:#f4f7f9;--surface:#fff;--surface2:#edf3f6;--ink:#10283b;--muted:#657d8d;--line:#dce6eb;--navy:#0f2d4a;--green:#16c47f;--cyan:#0ea5e9;--orange:#f59e0b;--shadow:0 8px 26px #0f2d4a0c}
[data-theme=dark]{--bg:#091521;--surface:#102233;--surface2:#172d40;--ink:#edf7fb;--muted:#9db1bf;--line:#294254;--navy:#d8f0ff;--shadow:0 8px 26px #0003}
[data-theme=ocean]{--bg:#eaf4fc;--surface:#fff;--surface2:#dcecf9;--ink:#12334e;--muted:#597b95;--line:#c6dfef;--navy:#174a73;--green:#087fbd}
[data-theme=forest]{--bg:#eef6f0;--surface:#fff;--surface2:#e0efe4;--ink:#173c2c;--muted:#587966;--line:#cee3d4;--navy:#184c36;--green:#188751}
[data-theme=contrast]{--bg:#fff;--surface:#fff;--surface2:#eee;--ink:#000;--muted:#333;--line:#444;--navy:#000;--green:#006b36;--cyan:#0055aa;--orange:#874100}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.layout{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}aside{padding:18px 12px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;padding:3px 8px}.mark{width:38px;height:38px;flex:none}.brand b{display:block;font-size:17px;letter-spacing:-.7px}.brand small{display:block;font-size:9px;letter-spacing:1px;color:var(--muted)}nav{display:grid;gap:5px}nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);padding:11px;border-radius:11px;text-align:left;cursor:pointer;font-weight:650}nav button.active,nav button:hover{background:var(--surface2);color:var(--ink)}nav button.active{box-shadow:inset 3px 0 var(--green)}.side-bottom{margin-top:auto;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px;font-size:12px}.side-bottom b{display:block;margin-bottom:4px}main{min-width:0;padding:22px clamp(14px,2.4vw,34px) 30px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill,.btn{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:8px 11px}.btn{cursor:pointer;font-weight:700}.btn.primary{background:var(--green);border-color:var(--green);color:#062d1d}.profile{display:flex;align-items:center;gap:9px;font-weight:700}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--cyan));color:#fff;font-weight:900}.eyebrow{color:var(--green);font-weight:850;font-size:11px;letter-spacing:1.3px;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:20px;flex-wrap:wrap}.heading h1{font-size:clamp(25px,3vw,35px);letter-spacing:-1.2px;margin:4px 0}.heading p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow);min-width:0}.stat-label{color:var(--muted);font-size:12px}.stat{font-size:clamp(22px,2.2vw,30px);font-weight:850;letter-spacing:-1px;margin:10px 0 5px}.delta{font-size:11px;color:var(--green);font-weight:750}.panel-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(240px,1fr);gap:14px;margin-top:14px}.card h2{font-size:16px;margin:0 0 14px;letter-spacing:-.3px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row strong{display:block;font-size:12px}.row small{color:var(--muted);font-size:11px}.tag{font-size:10px;font-weight:800;border-radius:999px;padding:5px 8px;background:var(--surface2);white-space:nowrap}.tag.good{background:#dff8e9;color:#087c4d}.tag.warn{background:#fff0d8;color:#8b5400}.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:99px}.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.quick button{border:1px solid var(--line);border-radius:13px;background:var(--surface2);padding:14px 10px;text-align:left;color:var(--ink);cursor:pointer}.quick button b{display:block;margin-top:8px;font-size:12px}.quick button small{display:block;color:var(--muted);font-size:10px}.quick button:hover{border-color:var(--green);transform:translateY(-1px)}.notice{padding:12px 14px;background:linear-gradient(110deg,#e0faed,#e0f4ff);color:#123d36;border-radius:13px;font-size:12px;margin-top:14px}.empty{padding:24px;text-align:center;color:var(--muted)}.list-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.list-head input{min-width:140px;flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}.product{display:flex;gap:10px;align-items:center}.product-icon{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-size:18px}.pos-total{font-size:27px;font-weight:900}.cart-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.cart-item button{border:0;background:var(--surface2);color:var(--ink);border-radius:6px;cursor:pointer}.hidden{display:none!important}
.flow-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.flow-card{min-width:0}.flow-desc{color:var(--muted);font-size:12px;margin:0 0 12px}.flowchart{display:flex;flex-direction:column;align-items:stretch;gap:5px}.flow-node{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;text-align:center}.flow-node b{display:block;font-size:12px}.flow-node small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.flow-node.start{border-color:var(--green)}.flow-node.end{border-color:var(--cyan)}.flow-arrow{text-align:center;color:var(--green);font-size:18px;line-height:16px}.brand-preview{margin:12px 0;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center}.brand-preview img{display:block;width:100%;max-height:240px;object-fit:contain}.brand-preview.dark-preview{background:#0F2D4A}.asset-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.asset-links a{font-size:11px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;background:var(--surface2)}.swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.swatch{border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}.swatch span{display:block;height:30px;border-radius:7px;margin-bottom:7px}.swatch b,.swatch code,.swatch small{display:block;font-size:11px}.swatch code{font-size:10px;margin:3px 0}.swatch small{color:var(--muted);margin-bottom:8px}.swatch .btn{padding:5px 7px;font-size:10px}.logo-variants{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}.logo-variants a{color:var(--ink);text-decoration:none}.logo-bg{height:84px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line)}.logo-bg img{width:52px;height:42px;object-fit:contain}.logo-bg.light{background:#fff}.logo-bg.dark{background:#0f2d4a}.logo-bg.mono{background:#eee}.logo-variants small{font-size:10px;color:var(--muted);display:block;margin-top:5px}.compact-list{padding-left:18px;font-size:11px;color:var(--muted)}.compact-list li{margin:7px 0}.breakpoint{padding:10px 0;border-bottom:1px solid var(--line)}.breakpoint b{font-size:12px}.breakpoint span{float:right;font-size:10px;color:var(--green);font-weight:800}.breakpoint small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.check-row{display:flex;gap:9px;align-items:flex-start}.check-dot{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:var(--surface2);color:var(--green);font-weight:900;flex:none}.check-row b{display:block;font-size:12px}.check-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
@media(max-width:1000px){.flow-grid{grid-template-columns:1fr}.checklist{grid-template-columns:1fr}}
@media(max-width:1000px){.layout{grid-template-columns:76px minmax(0,1fr)}aside{padding:15px 8px}.brand{justify-content:center;padding:0}.brand .wordmark,.brand small,nav .nav-label,.side-bottom{display:none}nav button{justify-content:center;font-size:18px;padding:12px 5px}nav button .nav-label{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel-grid{grid-template-columns:1fr}}
@media(max-width:620px){.layout{display:block}aside{position:sticky;top:0;z-index:5;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;display:block}aside .brand{display:none}nav{display:flex;overflow-x:auto;gap:4px}nav button{min-width:45px;padding:10px;flex:1}nav button.active{box-shadow:inset 0 -3px var(--green)}main{padding:15px 12px 24px}.top{margin-bottom:18px}.top .crumb{display:none}.profile span{display:none}.grid{gap:9px}.card{padding:13px;border-radius:14px}.stat{font-size:23px}.panel-grid{gap:10px}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.heading h1{font-size:27px}.heading p{font-size:12px}.top-actions .pill{display:none}}
</style>
</head>
<body>
<div class="layout">
<aside>
<div class="brand"><img class="mark" src="assets/vyavsetu-mark.svg" alt="Vyavsetu brand mark"><div class="wordmark"><b>VYAV<span style="color:var(--green)">SETU</span></b><small>ONE ECOSYSTEM. EVERY BUSINESS.</small></div></div>
<nav id="nav">
<button class="active" data-page="overview" title="Overview">⌂ <span class="nav-label">Overview</span></button>
<button data-page="pos" title="POS">▦ <span class="nav-label">POS Terminal</span></button>
<button data-page="restaurant" title="Restaurant">♨ <span class="nav-label">Restaurant / KDS</span></button>
<button data-page="inventory" title="Inventory">▤ <span class="nav-label">Inventory</span></button>
<button data-page="market" title="Marketplace">◇ <span class="nav-label">Customer Marketplace</span></button>
<button data-page="driver" title="Delivery">➤ <span class="nav-label">Driver App</span></button>
<button data-page="admin" title="Super Admin">⚙ <span class="nav-label">SaaS Super Admin</span></button>
<button data-page="developer" title="Developer Access">⌘ <span class="nav-label">Developer Access</span></button>
</nav>
<div class="side-bottom"><b>Demo workspace</b>Sample data only<br><span style="color:var(--muted)">No live payments or server sync.</span></div>
</aside>
<main>
<div class="top"><div class="crumb">Workspace / <strong id="crumbPage">Overview</strong></div><div class="top-actions"><span class="pill">● Demo environment</span><select class="pill" id="localTheme" aria-label="Theme"><option value="light">Light theme</option><option value="dark">Dark theme</option><option value="ocean">Ocean theme</option><option value="forest">Forest theme</option><option value="contrast">High contrast</option></select><div class="profile"><div class="avatar">V</div><span>Vyavsetu Demo</span></div></div></div>
<div id="content"></div>
</main>
</div>
<script>
const pages={overview:{label:'Overview',eyebrow:'BUSINESS OVERVIEW',title:'Good morning, business is moving.',sub:'Here’s a snapshot of your connected business ecosystem.'},pos:{label:'POS Terminal',eyebrow:'POINT OF SALE',title:'Your counter, ready to sell.',sub:'Fast checkout, clear totals and a simple sample cart.'},restaurant:{label:'Restaurant / KDS',eyebrow:'RESTAURANT OPERATIONS',title:'Service is in motion.',sub:'Track kitchen tickets and order readiness at a glance.'},inventory:{label:'Inventory',eyebrow:'STOCK CONTROL',title:'Know what is moving.',sub:'Monitor stock levels and keep replenishment visible.'},market:{label:'Customer Marketplace',eyebrow:'CUSTOMER MARKETPLACE',title:'Discover nearby favourites.',sub:'A sample customer-facing storefront and order experience.'},driver:{label:'Driver App',eyebrow:'LAST-MILE DELIVERY',title:'Deliveries, clearly organised.',sub:'A lightweight dispatch view for drivers and operations.'},admin:{label:'SaaS Super Admin',eyebrow:'PLATFORM CONTROL',title:'Manage the whole ecosystem.',sub:'Sample tenant, subscription and platform health overview.'},developer:{label:'Developer Access',eyebrow:'DEVELOPER HANDOFF',title:'The complete Vyavsetu blueprint.',sub:'Brand assets, design tokens, responsive rules, architecture, business logic and implementation flows.'}};
const content=document.getElementById('content');let activePage='overview',cart=0;
const stats=(items)=>'<section class="grid">'+items.map(x=>'<article class="card"><div class="stat-label">'+x[0]+'</div><div class="stat">'+x[1]+'</div><div class="delta">'+x[2]+'</div></article>').join('')+'</section>';
const row=(icon,title,sub,tag,cls='')=>'<div class="row"><div class="product"><div class="product-icon">'+icon+'</div><div><strong>'+title+'</strong><small>'+sub+'</small></div></div><span class="tag '+cls+'">'+tag+'</span></div>';
function header(p){return '<div class="heading"><div><div class="eyebrow">'+p.eyebrow+'</div><h1>'+p.title+'</h1><p>'+p.sub+'</p></div><button class="btn primary" onclick="toast(\'Demo action completed\')">＋ New action</button></div>'}
function overview(){return stats([['Today’s sales','₹ 48,250','↑ 12.8% vs yesterday'],['Orders','186','↑ 18 orders today'],['Active products','1,248','Across 3 locations'],['Pending deliveries','12','4 need attention']])+ '<div class="panel-grid"><article class="card"><h2>Business activity <span class="tag good">Live demo</span></h2>'+row('▦','Retail POS','Counter sales · Today','Healthy','good')+row('♨','Restaurant','Kitchen tickets · 8 open','In service','warn')+row('◇','Marketplace','Customer orders · 24 today','Growing','good')+row('➤','Delivery','Drivers active · 6 online','On route','good')+'</article><article class="card"><h2>Quick actions</h2><div class="quick"><button onclick="go(\'pos\')">▦<b>Open POS</b><small>Start a sale</small></button><button onclick="go(\'restaurant\')">♨<b>Kitchen</b><small>View tickets</small></button><button onclick="go(\'inventory\')">▤<b>Inventory</b><small>Check stock</small></button><button onclick="go(\'market\')">◇<b>Marketplace</b><small>Customer view</small></button><button onclick="go(\'driver\')">➤<b>Delivery</b><small>Track dispatch</small></button><button onclick="go(\'admin\')">⚙<b>Super Admin</b><small>Platform health</small></button></div></article></div><div class="notice"><strong>One Ecosystem. Every Business.</strong> &nbsp; Shared product direction for retail, restaurants, marketplace, delivery and platform administration.</div>'}
function pos(){return stats([['Cart items',cart,'Demo basket'],['Subtotal','₹ '+(cart*250).toLocaleString('en-IN'),'Sample item price ₹250'],['Tax estimate','₹ '+(cart*45).toLocaleString('en-IN'),'Illustrative only'],['Total','₹ '+(cart*295).toLocaleString('en-IN'),'No real payment']])+'<div class="panel-grid"><article class="card"><h2>Quick products</h2>'+[['🥗','Garden bowl','₹250'],['☕','Cold coffee','₹180'],['🥪','Grilled sandwich','₹220'],['🍰','Chocolate pastry','₹150']].map((p,i)=>'<div class="row"><div class="product"><div class="product-icon">'+p[0]+'</div><div><strong>'+p[1]+'</strong><small>'+p[2]+'</small></div></div><button class="btn" onclick="addCart('+[250,180,220,150][i]+')">Add +</button></div>').join('')+'</article><article class="card"><h2>Current sale</h2><div class="pos-total">₹ '+(cart*295).toLocaleString('en-IN')+'</div><p style="color:var(--muted);font-size:12px">Tax-inclusive demo estimate</p>'+row('🧾','Sale #DEMO-1042','Counter 01','Draft')+'<button class="btn primary" style="width:100%;margin-top:14px" onclick="toast(\'Demo checkout only — no payment processed\')">Proceed to checkout</button><button class="btn" style="width:100%;margin-top:8px" onclick="cart=0;go(\'pos\')">Clear cart</button></article></div>'}
function restaurant(){return stats([['New tickets','08','Waiting for kitchen'],['Preparing','05','In progress'],['Ready to serve','03','Notify service staff'],['Avg. prep time','14 min','Target under 18 min']])+'<div class="panel-grid"><article class="card"><h2>Kitchen display</h2>'+row('🍜','Order #K-204 · Table 4','2 items · 8 minutes','Preparing','warn')+row('🍔','Order #K-205 · Takeaway','3 items · 5 minutes','New','warn')+row('🥗','Order #K-206 · Table 2','1 item · 12 minutes','Ready','good')+row('🍕','Order #K-207 · Delivery','4 items · 2 minutes','New','warn')+'</article><article class="card"><h2>Service workflow</h2><p>New order → Preparing → Ready → Served</p><div class="bar"><span style="width:74%"></span></div><p style="color:var(--muted);font-size:12px">74% of today's tickets completed on time.</p><button class="btn primary" onclick="toast('Kitchen action simulated')">Mark next ticket ready</button></article></div>'}
function inventory(){return stats([['Stock items','1,248','Across locations'],['Low stock','17','Reorder recommended'],['Stock value','₹ 8.42L','Sample valuation'],['Purchase orders','06','2 awaiting approval']])+'<article class="card" style="margin-top:14px"><div class="list-head"><h2 style="margin:0">Inventory overview</h2><input id="stockSearch" placeholder="Search stock items…" oninput="filterRows()"></div><div id="stockRows">'+row('🥛','Whole milk · 1L','SKU MIL-001 · Pantry','Low stock','warn')+row('☕','Arabica coffee beans','SKU COF-014 · Beverage','In stock','good')+row('🥫','Tomato sauce · 2kg','SKU SAU-011 · Kitchen','In stock','good')+row('📦','Paper takeaway cups','SKU PKG-006 · Packaging','Reorder','warn')+row('🧀','Mozzarella cheese','SKU DAI-021 · Chilled','In stock','good')+'</div></article>'}
function market(){return '<div class="card" style="background:linear-gradient(120deg,#e0faed,#e3f4ff);color:#123d36;margin-bottom:14px"><div class="eyebrow">VYAVSETU MARKET</div><h1 style="font-size:30px;margin:8px 0">Your local favourites, delivered.</h1><p>Explore sample stores and customer ordering flow.</p><button class="btn primary" onclick="toast(\'Store discovery demo opened\')">Explore stores →</button></div>'+stats([['Nearby stores','24','Restaurants and retail'],['Offers','08','Sample promotions'],['Order status','Preparing','Order #VM-2084'],['Estimated arrival','22 min','Illustrative ETA']])+'<div class="panel-grid"><article class="card"><h2>Popular nearby</h2>'+row('🥗','Green Bowl Co.','Healthy meals · 4.8 ★','20–30 min','good')+row('🛒','Daily Needs Market','Groceries · 4.6 ★','15–25 min','good')+row('☕','Bean & Bloom','Coffee and bakery · 4.7 ★','10–20 min','good')+'</article><article class="card"><h2>Your sample order</h2>'+row('🧾','Order #VM-2084','2 items · ₹540','Preparing','warn')+'<div class="bar"><span style="width:58%"></span></div><p style="color:var(--muted);font-size:12px">Store accepted → Preparing → Out for delivery → Delivered</p></article></div>'}
function driver(){return stats([['Assigned orders','04','2 pickups pending'],['Completed today','12','Sample driver shift'],['Distance covered','18.4 km','Illustrative'],['Shift status','Online','Available for jobs']])+'<div class="panel-grid"><article class="card"><h2>Delivery queue</h2>'+row('🛍️','Pickup · Green Bowl Co.','Order #VM-2084 · 1.2 km','Pickup','warn')+row('📍','Drop · Sector 18','Customer order · 2.4 km','Assigned','good')+row('🛍️','Pickup · Daily Needs','Order #VM-2088 · 0.8 km','Pickup','warn')+'</article><article class="card"><h2>Driver shift</h2><div class="product"><div class="avatar">RK</div><div><strong>Rahul Kumar</strong><small>Driver ID · DEMO-024</small></div></div><div class="notice">Safety first. Confirm pickup and delivery status in the real application.</div><button class="btn primary" style="margin-top:12px" onclick="toast('Driver status updated in demo only')">Update availability</button></article></div>'}
function admin(){return stats([['Active tenants','248','Across demo plans'],['Monthly recurring revenue','₹ 8.6L','Illustrative only'],['Subscriptions','231','17 trials'],['Platform health','99.9%','Sample metric']])+'<div class="panel-grid"><article class="card"><h2>Tenant overview</h2>'+row('🏪','Green Bowl Hospitality','Growth plan · 4 locations','Active','good')+row('🛒','Daily Needs Retail','Starter plan · 2 locations','Active','good')+row('🍽️','Urban Tandoor Group','Enterprise · 8 locations','Trial','warn')+row('🚚','SwiftCart Local','Growth plan · 1 location','Review','warn')+'</article><article class="card"><h2>Platform controls</h2>'+row('🔐','Access & permissions','Role-based access','Configured','good')+row('💳','Plans & subscriptions','Billing configuration','Demo','warn')+row('📋','Audit trail','Sample activity records','Available','good')+row('⚑','Feature flags','Product rollout controls','Available','good')+'<button class="btn primary" style="width:100%;margin-top:14px" onclick="go(\\'developer\\')">⌘ Open Developer Handoff →</button></article></div>'}

function developer(){
  const flows=[
    {title:'1. Authentication & permissions',desc:'A hidden button is not security. The server checks every protected request.',steps:[['App launch / login','Restore valid session or request credentials'],['Verify identity','Token/session is valid and not expired'],['Load context','Tenant, location, membership and role'],['Authorize action?','Allowed → continue; denied → 401/403 + audit'] ]},
    {title:'2. POS checkout & invoicing',desc:'Backend validates prices, discounts, stock and tax; final invoices are immutable.',steps:[['Scan / select items','Create a local draft cart'],['Validate cart','Price version, tax jurisdiction, stock, discount rights'],['Calculate total','Server calculation, rounding and tax breakdown'],['Payment outcome','Cash / gateway / split; idempotency key'],['Commit sale','Atomic order + stock ledger + payment record'],['Issue final invoice','Number, immutable document, PDF/thermal print job'] ]},
    {title:'3. Offline-first sync',desc:'Local writes never disappear on restart. First screen render must not wait for full sync.',steps:[['User action offline','Persist local row + outbox event atomically'],['Auth/connectivity gate','Keep pending when user/session/network is not ready'],['Push idempotently','Stable key, schema version, tenant context'],['Server validates','Permission, state transition, duplicates, stock conflicts'],['ACK / conflict / reject','Update visible sync state; preserve failed payload'],['Pull delta + reconcile','Refresh local cache without blocking UI'] ]},
    {title:'4. Marketplace → restaurant → driver',desc:'Each order state transition is validated and timestamped.',steps:[['Customer chooses store','Validate open hours, catalog and delivery zone'],['Create order','Revalidate current price, tax, stock and serviceability'],['Merchant decision','Reject → cancellation/refund policy; accept → kitchen'],['Kitchen workflow','New → Preparing → Ready'],['Delivery assignment','Eligible driver accepts and confirms pickup'],['Complete order','Proof of delivery, timeline and notifications'] ]},
    {title:'5. Inventory & purchasing',desc:'Record stock changes as ledger movements; do not silently overwrite counts.',steps:[['Sale / receive / transfer / count','Every movement has source and actor'],['Validate scope','Tenant, location, quantity, reason, permission'],['Append movement','Atomic movement ledger and updated balance'],['Below reorder point?','Yes → alert / draft purchase order; no → continue'],['Conflict / negative stock?','Apply chosen policy and require resolution if needed'] ]},
    {title:'6. Errors, retry and recovery',desc:'Never report success until an operation is durably acknowledged.',steps:[['Request fails','Network, API validation, payment, printer or sync'],['Classify outcome','Retryable / permanent / unknown result'],['Retry safe?','Bounded backoff + idempotency key'],['Payment uncertain?','Reconcile with gateway reference; never blindly recharge'],['Permanent / exhausted','Show action needed; keep diagnostics and user draft'],['Recover + audit','Resolve then resume the state machine'] ]}
  ];
  const flowHtml=flows.map(function(f){return '<article class="card flow-card"><h2>'+f.title+'</h2><p class="flow-desc">'+f.desc+'</p><div class="flowchart">'+f.steps.map(function(s,i){return '<div class="flow-node '+(i===0?'start':i===f.steps.length-1?'end':'')+'"><b>'+s[0]+'</b><small>'+s[1]+'</small></div>'+(i<f.steps.length-1?'<div class="flow-arrow">↓</div>':'')}).join('')+'</div></article>'}).join('');
  const swatches=[['Navy','#0F2D4A','Trust, primary text and dark surfaces'],['Green','#16C47F','Growth and primary actions'],['Cyan','#0EA5E9','Technology and information'],['Orange','#F59E0B','Energy and highlights'],['Canvas','#F4F7F9','Light page background'],['Surface','#FFFFFF','Cards and panels'],['Main text','#10283B','Primary content'],['Muted text','#657D8D','Secondary content']];
  return '<section class="grid"><article class="card"><div class="eyebrow">APPROVED BRAND DIRECTION</div><h2>Vyavsetu logo system</h2><div class="brand-preview"><img src="assets/vyavsetu-lockup-light.svg" alt="Vyavsetu light-background logo"></div><div class="brand-preview dark-preview"><img src="assets/vyavsetu-lockup-dark.svg" alt="Vyavsetu dark-background logo"></div><p class="flow-desc">Tagline: <b>One Ecosystem. Every Business.</b> The three-petal V-inspired symbol expresses growth, technology and energy; “Setu” evokes a bridge connecting business workflows.</p><div class="asset-links"><a href="assets/vyavsetu-lockup-light.svg" target="_blank">Light lockup SVG ↗</a><a href="assets/vyavsetu-lockup-dark.svg" target="_blank">Dark lockup SVG ↗</a><a href="assets/vyavsetu-horizontal.svg" target="_blank">Horizontal lockup SVG ↗</a><a href="assets/vyavsetu-app-icon-light.svg" target="_blank">Light app icon ↗</a><a href="assets/vyavsetu-app-icon-dark.svg" target="_blank">Dark app icon ↗</a><a href="BRAND.md" target="_blank">Brand guidelines ↗</a></div></article><article class="card"><div class="eyebrow">DESIGN TOKENS</div><h2>Colour palette</h2><div class="swatches">'+swatches.map(function(c){return '<div class="swatch"><span style="background:'+c[1]+'"></span><b>'+c[0]+'</b><code>'+c[1]+'</code><small>'+c[2]+'</small><button class="btn" onclick="GenCopy(\\''+c[1]+'\\')">Copy HEX</button></div>'}).join('')+'</div><p class="flow-desc">Typography: Poppins-style geometric wordmark/headings with a system sans-serif fallback. Keep interactive text legible and test actual contrast in every theme.</p></article></section>'+
  '<section class="grid" style="margin-top:14px"><article class="card"><h2>Logo usage rules</h2><div class="logo-variants"><a href="assets/vyavsetu-lockup-light.svg" target="_blank"><div class="logo-bg light"><img src="assets/vyavsetu-mark.svg" alt=""></div><small>Light surface</small></a><a href="assets/vyavsetu-lockup-dark.svg" target="_blank"><div class="logo-bg dark"><img src="assets/vyavsetu-mark.svg" alt=""></div><small>Dark surface</small></a><a href="assets/vyavsetu-mark-navy.svg" target="_blank"><div class="logo-bg mono"><img src="assets/vyavsetu-mark-navy.svg" alt=""></div><small>Monochrome</small></a></div><ul class="compact-list"><li>Keep original proportions and petal colours; do not stretch, rotate, crop or add shadows.</li><li>Use icon-only for app icons and compact navigation, full lockup for brand pages, and horizontal lockup in narrow-height headers.</li><li>Maintain clear space around the mark. Avoid placing it over busy imagery.</li><li>SVGs are scalable vector recreations traced from the approved generated reference. Verify against final brand artwork before trademark or print production.</li></ul><p class="flow-desc"><a href="https://github.com/manjesh2024/vyavsetu/tree/main/assets" target="_blank">Browse all logo assets on GitHub ↗</a></p></article><article class="card"><h2>Responsive design contract</h2><div class="breakpoint"><b>Desktop / laptop</b><span>≥ 1200px</span><small>Full navigation, analytics, dense tables and multi-column dashboards.</small></div><div class="breakpoint"><b>Business-store POS</b><span>900–1199px</span><small>Touch/scanner-first checkout, visible cart, keyboard support and minimal distractions.</small></div><div class="breakpoint"><b>Tablet / iPad</b><span>620–899px</span><small>Compact navigation, two-column or stacked panels, landscape and portrait layouts.</small></div><div class="breakpoint"><b>Android / iPhone</b><span>≤ 619px</span><small>Single-column layouts, safe-area insets, reachable actions and text scaling.</small></div><p class="flow-desc">Current demo uses responsive HTML/CSS. Production target: Flutter adaptive layouts via LayoutBuilder/MediaQuery rather than hardcoded device model detection; test keyboard, scanner, printer and touch accessibility.</p></article></section>'+
  '<div class="notice"><b>Prototype / production boundary:</b> this site uses demonstration data. Real authentication, statutory tax/invoices, payments, hardware, sync, tenant isolation and persistent audit logging must be implemented and tested before production.</div>'+
  '<h2 style="margin:24px 0 10px">System architecture & workflow diagrams</h2><p class="flow-desc">These are proposed target flows and business contracts, not proof the backend integrations already exist. The full Mermaid source is in <a href="docs/ARCHITECTURE_FLOWCHARTS.md" target="_blank">Architecture Flowcharts ↗</a>.</p><div class="flow-grid">'+flowHtml+'</div>'+

  '<h2 style="margin:24px 0 10px">Developer implementation checklist</h2><article class="card"><div class="checklist">'+[['Frontend','Flutter feature-first Clean Architecture; shared tokens and adaptive navigation.'],['State and local data','Bloc/Riverpod as agreed per app; Drift database; versioned migrations.'],['Backend','Spring Boot modular monolith; PostgreSQL; documented API contracts.'],['Sync','Transactional outbox, stable idempotency keys, bounded retries and conflict resolution.'],['Security','Server-side RBAC, tenant boundaries, session expiry, secret hygiene and audit logs.'],['Quality','Domain/unit/API/widget tests, offline/retry/duplicate tests and a device matrix.'],['Release operations','Dev/staging/prod config, migrations, backup/restore, observability and rollback.']].map(function(c){return '<div class="check-row"><span class="check-dot">✓</span><div><b>'+c[0]+'</b><small>'+c[1]+'</small></div></div>'}).join('')+'</div></article>'+

function render(){const p=pages[activePage];document.getElementById('crumbPage').textContent=p.label;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));let body=({overview, pos, restaurant, inventory, market, driver, admin, developer})[activePage]();content.innerHTML=header(p)+body}
function go(page){activePage=page;render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(message){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;box-shadow:0 8px 28px #0002;z-index:50;max-width:90vw;text-align:center';document.body.appendChild(el)}el.textContent=message;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}
function addCart(price){cart++;render();toast('Item added to sample cart')}
function filterRows(){let q=(document.getElementById('stockSearch')?.value||'').toLowerCase();document.querySelectorAll('#stockRows .row').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'flex':'none')}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
document.getElementById('localTheme').value=localStorage.getItem('vyavsetu_theme')||'light';document.getElementById('localTheme').addEventListener('change',e=>{document.documentElement.dataset.theme=e.target.value;localStorage.setItem('vyavsetu_theme',e.target.value);parent.postMessage({type:'vyavsetu-theme',theme:e.target.value},'*')});
window.addEventListener('message',e=>{if(e.data?.type==='vyavsetu-theme'){document.documentElement.dataset.theme=e.data.theme;document.getElementById('localTheme').value=e.data.theme}});
render();
