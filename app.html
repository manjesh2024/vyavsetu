/* Vyavsetu print system: separate document surface, no screenshot printing. */
#printRoot{display:none}
.print-format-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}
.print-format-choice{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:13px 8px;text-align:center;font-weight:800;cursor:pointer}
.print-format-choice b,.print-format-choice small{display:block}
.print-format-choice small{font-size:10px;color:var(--muted);font-weight:500;margin-top:4px}
.print-format-choice:hover{border-color:var(--green);background:var(--surface2)}
.print-document-note{font-size:11px;color:var(--muted);margin:8px 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.form-grid .form-field{min-width:0}
.dev-doc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dev-doc-card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;min-width:0;display:flex;flex-direction:column;gap:9px}
.dev-doc-card .doc-icon{width:36px;height:36px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-size:18px}
.dev-doc-card h3{font-size:13px;margin:0}
.dev-doc-card p{font-size:11px;color:var(--muted);margin:0;flex:1}
.dev-doc-card a{font-size:11px;font-weight:800;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:inline-block;align-self:flex-start}
.dev-doc-card a:hover{border-color:var(--green);background:var(--surface2)}
.stack-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.stack-tags span{font-size:11px;font-weight:750;border:1px solid var(--line);background:var(--surface2);padding:7px 10px;border-radius:9px}
.print-sheet{font-family:Arial,Helvetica,sans-serif;color:#17232d;background:#fff;box-sizing:border-box;line-height:1.35}
.print-a4{width:210mm;min-height:297mm;padding:10mm;font-size:9pt}
.print-a4 .invoice-top{display:grid;grid-template-columns:1.13fr .95fr;gap:7mm;align-items:start;border-bottom:1px solid #d8e4e9;padding-bottom:4mm}
.print-a4 .invoice-brand{display:block;width:100%;max-width:103mm;height:22mm;object-fit:contain;object-position:left center}
.print-a4 .seller-name{font-size:14pt;font-weight:800;color:#0f2d4a;margin:1mm 0}
.print-a4 .seller-lines{font-size:8pt;line-height:1.45;overflow-wrap:anywhere}
.print-a4 .invoice-ribbon{background:#0f2d4a;color:#fff;text-align:right;padding:3mm 4mm 2.5mm;position:relative;margin-bottom:2mm}
.print-a4 .invoice-ribbon:before{content:'';position:absolute;top:0;left:0;border-top:13mm solid #16c47f;border-right:16mm solid transparent}
.print-a4 .invoice-ribbon strong{font-size:18pt;display:block;letter-spacing:.3px}
.print-a4 .invoice-ribbon small{font-size:7pt;display:block;font-weight:700;letter-spacing:.2px}
.print-a4 .invoice-meta{display:grid;grid-template-columns:27mm 3mm minmax(0,1fr);gap:1mm;background:#edf5f7;border-radius:2mm;padding:2.5mm;font-size:8pt}
.print-a4 .invoice-meta b{overflow-wrap:anywhere}
.print-a4 .invoice-two-col{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin:3mm 0}
.print-a4 .invoice-panel{border:1px solid #d9e7ed;border-radius:2mm;overflow:hidden;min-width:0}
.print-a4 .invoice-panel-title{background:#e8f2f6;color:#0f3d62;font-weight:800;padding:2mm 3mm}
.print-a4 .invoice-panel-body{padding:2mm 3mm 3mm;overflow-wrap:anywhere}
.print-a4 .invoice-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:3mm 0;font-size:7.6pt}
.print-a4 .invoice-table th{background:#0f3d5d;color:#fff;padding:2mm 1mm;text-align:center;font-weight:700}
.print-a4 .invoice-table td{border:1px solid #d4e0e7;padding:2mm 1mm;overflow-wrap:anywhere}
.print-a4 .invoice-table td:nth-child(1),.print-a4 .invoice-table td:nth-child(3),.print-a4 .invoice-table td:nth-child(4),.print-a4 .invoice-table td:nth-child(5),.print-a4 .invoice-table td:nth-child(7),.print-a4 .invoice-table td:nth-child(8){text-align:center}
.print-a4 .invoice-table td:nth-child(6),.print-a4 .invoice-table td:last-child{text-align:right}
.print-a4 .invoice-lower{display:grid;grid-template-columns:1fr .94fr;gap:4mm;margin-top:3mm}
.print-a4 .terms{font-size:7.8pt;padding:2mm 3mm}
.print-a4 .terms ol{margin:2mm 0;padding-left:5mm}
.print-a4 .terms li{margin-bottom:1mm}
.print-a4 .summary-row{display:flex;justify-content:space-between;gap:4mm;padding:1.6mm 3mm;border-bottom:1px solid #dce6eb}
.print-a4 .summary-row.total{background:#008f69;color:#fff;font-weight:900;font-size:13pt;border:0}
.print-a4 .amount-words{border:1px solid #d9e7ed;margin-top:3mm;border-radius:2mm;padding:2.5mm 3mm;overflow-wrap:anywhere}
.print-a4 .amount-words b{display:block;color:#0f3d62;margin-bottom:1mm}
.print-a4 .platform-strip{display:grid;grid-template-columns:repeat(4,1fr) 1.12fr;gap:1.5mm;align-items:center;margin-top:3mm;padding:2.5mm 0;border-top:1px solid #d9e7ed;border-bottom:1px solid #d9e7ed;font-size:6.8pt}
.print-a4 .platform-strip span{display:block;text-align:center;border-right:1px solid #b7cbd6}

function render(){const p=pages[activePage];document.getElementById('crumbPage').textContent=p.label;document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===activePage);const gate={market:'marketplace',driver:'driver',restaurant:'kds'}[b.dataset.page];if(gate){const enabled=featureFlags.find(f=>f.id===gate)?.enabled!==false;b.disabled=!enabled;b.title=enabled?(b.getAttribute('data-page')||''):'Disabled by feature flag';}});let body=({overview, pos, orders, restaurant, inventory, market, driver, admin, developer, products, purchases, suppliers, customers, returns, reports, staff, settings, plans, subscriptions, support, features})[activePage]();content.innerHTML=header(p)+body}

function toast(message){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;box-shadow:0 8px 28px #0002;z-index:50;max-width:90vw;text-align:center';document.body.appendChild(el)}el.textContent=message;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}

function advanceKitchen(id){const t=kitchenTickets.find(x=>x.id===id);if(!t)return;const next={New:'Preparing',Preparing:'Ready',Ready:'Served'};if(!next[t.status])return;t.status=next[t.status];t.updated=new Date().toISOString();writeStore('vyavsetu_kitchen_tickets',kitchenTickets);if(t.orderId){const o=demoOrders.find(x=>x.id===t.orderId);if(o){o.kitchenStatus=t.status;writeStore('vyavsetu_demo_orders',demoOrders)}}render();toast('Ticket '+t.id+' is now '+t.status)}

function advanceDriver(id,action){const j=driverJobs.find(x=>x.id===id);if(!j)return;if(!driverOnline){toast('Go online before updating a delivery');return}if(action==='accept'&&j.status==='Available')j.status='Assigned';else if(action==='pickup'&&j.status==='Assigned')j.status='Picked up';else if(action==='route'&&j.status==='Picked up')j.status='Out for delivery';else if(action==='complete'&&j.status==='Out for delivery'){showDialog('Complete delivery · '+j.orderId,'<div class="notice">Demo OTP: <b>'+esc(j.otp||'2468')+'</b>. In production, OTP must be verified by the server.</div><div class="form-field"><label>Enter OTP *</label><input id="driverOtp" inputmode="numeric" maxlength="4" required></div><div class="form-field"><label>Proof of handover</label><select id="driverProof"><option>Photo captured (demo)</option><option>Customer signature (demo)</option><option>Supervisor review</option></select></div><div class="form-field"><label>Handover note</label><input id="driverNote" placeholder="Handed to customer"></div>','<button class="btn" data-action="close-dialog">Cancel</button><button class="btn primary" data-action="confirm-delivery" data-driver-id="'+esc(id)+'">Confirm delivery</button>');return}else{toast('That transition is not available');return}j.updated=new Date().toISOString();j.history=j.history||[];j.history.push({status:j.status,at:j.updated});writeStore('vyavsetu_driver_jobs',driverJobs);const o=findOrderForDriver(j);const linkedOrderId=String(o?.id||j.orderId);deliveryStatuses[linkedOrderId]=j.status;writeStore('vyavsetu_delivery_statuses',deliveryStatuses);if(o){o.deliveryStatus=j.status;writeStore('vyavsetu_demo_orders',demoOrders)}render();toast(j.orderId+' updated: '+j.status)}
function completeDriverDelivery(id){const j=driverJobs.find(x=>x.id===id),otp=document.getElementById('driverOtp')?.value.trim();if(!j||otp!==(j.otp||'2468')){toast('OTP does not match');return}j.status='Delivered';j.proof=document.getElementById('driverProof')?.value||'Photo captured (demo)';j.note=document.getElementById('driverNote')?.value.trim()||'';j.updated=new Date().toISOString();j.history=j.history||[];j.history.push({status:'Delivered',at:j.updated});writeStore('vyavsetu_driver_jobs',driverJobs);const o=findOrderForDriver(j);const linkedOrderId=String(o?.id||j.orderId);deliveryStatuses[linkedOrderId]='Delivered';writeStore('vyavsetu_delivery_statuses',deliveryStatuses);if(o){o.deliveryStatus='Delivered';o.deliveredAt=j.updated;writeStore('vyavsetu_demo_orders',demoOrders)}closeDialog();render();toast('Delivery completed')}
function createDriverJob(order){if(driverJobs.some(j=>j.orderId===order.id))return;const first=order.lines?.[0];const j={id:'DV-'+String(Date.now()).slice(-6),orderId:order.id,shopName:first?.shopName||'Marketplace store',customer:order.customer,phone:order.phone,address:order.address,total:order.total,status:'Available',otp:'2468',created:order.created,history:[{status:'Available',at:order.created}]};driverJobs.unshift(j);writeStore('vyavsetu_driver_jobs',driverJobs);order.deliveryStatus='Available';if(first&&['green','cafe'].includes(first.shop)){kitchenTickets.unshift({id:'K-'+order.id.slice(-6),orderId:order.id,title:(first.shopName||'Restaurant')+' · Marketplace',items:order.lines.map(l=>l.name+' × '+l.qty).join(', '),source:'Delivery',minutes:0,status:'New',created:order.created});writeStore('vyavsetu_kitchen_tickets',kitchenTickets)}}
function openStockDialog(id,mode){const x=inventoryItems.find(i=>i.id===id);const selector=id&&x?'<input value="'+esc(x.name)+' · '+x.id+'" disabled>':'<select id="stockItem" required>'+inventoryItems.map(i=>'<option value="'+esc(i.id)+'">'+esc(i.name)+' · '+esc(i.id)+' · '+i.stock+' units</option>').join('')+'</select>';showDialog(mode==='receive'?'Receive stock':'Adjust stock', '<div class="form-field"><label>Item</label>'+selector+'</div><div class="form-field"><label>'+(mode==='receive'?'Units to receive':'New stock count')+'</label><input id="stockQty" type="number" min="'+(mode==='receive'?'1':'0')+'" step="1" value="'+(mode==='receive'?1:x?.stock||0)+'" required></div><div class="form-field"><label>Reason</label><select id="stockReason"><option>Routine stock count</option><option>Supplier receipt</option><option>Damaged / write-off</option><option>Correction</option></select></div>','<button class="btn" data-action="close-dialog">Cancel</button><button class="btn primary" data-action="save-stock" data-stock-id="'+esc(id||'')+'" data-stock-mode="'+mode+'">Save change</button>')}
function saveStock(id,mode){const selected=id||document.getElementById('stockItem')?.value,x=inventoryItems.find(i=>i.id===selected),q=Number(document.getElementById('stockQty')?.value);if(!x||!Number.isInteger(q)||q<0||(mode==='receive'&&q<1)){toast('Choose an item and enter a valid whole number');return}const before=x.stock;x.stock=mode==='receive'?x.stock+q:q;const catalogItem=posProducts.find(p=>p.sku===x.id);if(catalogItem){catalogItem.stock=x.stock;writeStore('vyavsetu_pos_products',posProducts)}writeStore('vyavsetu_inventory_items',inventoryItems);const h=readStore('vyavsetu_stock_history',[]);h.unshift({id:x.id,item:x.name,before,after:x.stock,mode,reason:document.getElementById('stockReason')?.value||'Adjustment',at:new Date().toISOString()});writeStore('vyavsetu_stock_history',h);logAdmin('Stock '+mode,x.name+' · '+before+' → '+x.stock);closeDialog();render();toast('Stock updated: '+x.name+' now '+x.stock)}
function openTenantDialog(){showDialog('Add business tenant','<div class="form-field"><label>Business name *</label><input id="tenantName" required placeholder="Example Retail Store"></div><div class="form-field"><label>Owner name *</label><input id="tenantOwner" required placeholder="Business owner"></div><div class="form-field"><label>Email *</label><input id="tenantEmail" type="email" required placeholder="owner@example.com"></div><div class="form-field"><label>Plan</label><select id="tenantPlan"><option>Starter</option><option>Growth</option><option>Enterprise</option></select></div><div class="form-field"><label>Locations</label><input id="tenantLocations" type="number" min="1" value="1" required></div>','<button class="btn" data-action="close-dialog">Cancel</button><button class="btn primary" data-action="save-tenant">Create tenant</button>')}

const rows=posProducts.map(p=>'<div class="row module-row"><div class="product"><div class="product-icon">'+esc(p.emoji||'📦')+'</div><div><strong>'+esc(p.name)+'</strong><small>'+esc(p.sku)+' · '+esc(p.cat||'General')+' · '+p.stock+' in stock</small></div></div><div class="module-actions"><b>'+money(p.price)+'</b><button class="btn" data-product-edit="'+esc(p.id)+'">Edit</button><button class="btn danger" data-product-delete="'+esc(p.id)+'">Delete</button></div></div>').join('');

function filterProducts(){const q=(document.getElementById('productSearch')?.value||'').toLowerCase();document.querySelectorAll('#productRows .module-row').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'flex':'none')}
function openProductDialog(id){const p=posProducts.find(x=>x.id===id);showDialog(p?'Edit product':'Add product','<div class="form-field"><label>Product name *</label><input id="pName" required value="'+esc(p?.name||'')+'"></div><div class="form-field"><label>SKU *</label><input id="pSku" required value="'+esc(p?.sku||'')+'" '+(p?'readonly':'')+'></div><div class="form-field"><label>Category</label><input id="pCat" value="'+esc(p?.cat||'Retail')+'"></div><div class="form-field"><label>Price (₹) *</label><input id="pPrice" type="number" min="0.01" step="0.01" required value="'+(p?.price??'')+'"></div><div class="form-field"><label>Opening stock *</label><input id="pStock" type="number" min="0" step="1" required value="'+(p?.stock??0)+'"></div><div class="form-field"><label>Emoji / icon</label><input id="pEmoji" maxlength="6" value="'+esc(p?.emoji||'📦')+'"></div>','<button class="btn" data-action="close-dialog">Cancel</button><button class="btn primary" data-action="save-product" data-product-id="'+esc(id||'')+'">Save product</button>')}
function saveProduct(id){const name=document.getElementById('pName')?.value.trim(),sku=document.getElementById('pSku')?.value.trim().toUpperCase(),cat=document.getElementById('pCat')?.value.trim()||'General',price=Number(document.getElementById('pPrice')?.value),stock=Number(document.getElementById('pStock')?.value),emoji=document.getElementById('pEmoji')?.value.trim()||'📦';if(!name||!sku||!Number.isFinite(price)||price<=0||!Number.isInteger(stock)||stock<0){toast('Complete product details with valid price and stock');return}let p=posProducts.find(x=>x.id===id);if(posProducts.some(x=>x.sku.toLowerCase()===sku.toLowerCase()&&x.id!==id)){toast('SKU already exists');return}if(p){Object.assign(p,{name,cat,price,stock,emoji});}else{p={id:'P-'+String(Date.now()).slice(-7),sku,name,cat,price,stock,emoji};posProducts.unshift(p)}writeStore('vyavsetu_pos_products',posProducts);let inv=inventoryItems.find(x=>x.id===sku);if(inv){Object.assign(inv,{name,category:cat,price,stock})}else{inventoryItems.unshift({id:sku,name,category:cat,price,stock,reorder:5})}writeStore('vyavsetu_inventory_items',inventoryItems);logAdmin(p?'Updated product':'Created product',name+' ('+sku+')');closeDialog();go('products');toast('Product saved: '+name)}
function deleteProduct(id){const p=posProducts.find(x=>x.id===id);if(!p)return;if(cart[id]||marketCart[id]){toast('Remove this product from active baskets first');return}if(!confirm('Delete '+p.name+' from this demo catalogue?'))return;posProducts=posProducts.filter(x=>x.id!==id);writeStore('vyavsetu_pos_products',posProducts);inventoryItems=inventoryItems.filter(x=>x.id!==p.sku);writeStore('vyavsetu_inventory_items',inventoryItems);logAdmin('Deleted product',p.name);render();toast('Product deleted')}
function purchases(){const rows=purchaseOrders.map(p=>'<div class="row module-row"><div><strong>'+esc(p.id)+' · '+esc(p.productName)+'</strong><small>'+esc(p.supplierName)+' · '+p.qty+' units × '+money(p.unitCost)+' · '+new Date(p.created).toLocaleDateString()+'</small></div><div class="module-actions"><span class="tag '+(p.status==='Received'?'good':p.status==='Draft'?'warn':'')+'">'+esc(p.status)+'</span>'+(p.status==='Draft'?'<button class="btn" data-po-action="order" data-po-id="'+p.id+'">Mark ordered</button>':'')+(p.status!=='Received'?'<button class="btn primary" data-po-action="receive" data-po-id="'+p.id+'">Receive goods</button>':'')+'</div></div>').join('');
return stats([['Purchase orders',purchaseOrders.length,'Browser-local records'],['Draft',purchaseOrders.filter(p=>p.status==='Draft').length,'Not yet sent'],['Ordered',purchaseOrders.filter(p=>p.status==='Ordered').length,'Awaiting goods'],['Received value',money(purchaseOrders.filter(p=>p.status==='Received').reduce((a,p)=>a+p.total,0)),'Demo receiving value']])+'<article class="card" style="margin-top:14px"><div class="list-head"><h2 style="margin:0">Purchase orders</h2><button class="btn primary" data-action="new-purchase">＋ Create purchase order</button></div>'+(rows||'<div class="empty">No purchase orders yet. Create one and mark goods received to update stock.</div>')+'</article>';
}
function openPurchaseDialog(){const suppliers=supplierRecords.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join(''),prods=posProducts.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+' · '+esc(x.sku)+' · '+money(x.price)+'</option>').join('');showDialog('Create purchase order','<div class="form-field"><label>Supplier *</label><select id="poSupplier" required>'+suppliers+'</select></div><div class="form-field"><label>Product *</label><select id="poProduct" required>'+prods+'</select></div><div class="form-field"><label>Quantity *</label><input id="poQty" type="number" min="1" step="1" value="10" required></div><div class="form-field"><label>Unit cost (₹) *</label><input id="poCost" type="number" min="0.01" step="0.01" value="'+(posProducts[0]?.price||1)+'" required></div><div class="form-field"><label>Expected date</label><input id="poExpected" type="date"></div><p class="flow-desc">A draft does not affect stock. Stock is increased only after you receive goods.</p>','<button class="btn" data-action="close-dialog">Cancel</button><button class="btn primary" data-action="save-purchase">Save draft</button>')}
function savePurchase(){const supplier=supplierRecords.find(x=>x.id===document.getElementById('poSupplier')?.value),p=posProducts.find(x=>x.id===document.getElementById('poProduct')?.value),qty=Number(document.getElementById('poQty')?.value),unitCost=Number(document.getElementById('poCost')?.value),expected=document.getElementById('poExpected')?.value;if(!supplier||!p||!Number.isInteger(qty)||qty<1||!Number.isFinite(unitCost)||unitCost<=0){toast('Check supplier, product, quantity and cost');return}const order={id:'PO-'+String(Date.now()).slice(-7),supplierId:supplier.id,supplierName:supplier.name,productId:p.id,sku:p.sku,productName:p.name,qty,unitCost,total:qty*unitCost,expected,status:'Draft',created:new Date().toISOString()};purchaseOrders.unshift(order);writeStore('vyavsetu_purchase_orders',purchaseOrders);logAdmin('Created purchase order',order.id+' · '+order.productName);closeDialog();go('purchases');toast('Purchase order saved as draft')}
